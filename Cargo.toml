[workspace]
members = [ "wkt", "wkt-derive", "wkt-types", "example" ]
resolver = "2"

[workspace.package]
version = "0.8.0"
authors = ["fdeantoni <fdeantoni@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/fdeantoni/prost-wkt"
description = "Helper crate for prost to allow JSON serialization and deserialization of Well Known Types."
readme = "README.md"
documentation = "https://docs.rs/prost-wkt-derive"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
prost = "0.14.1"
prost-types = "0.14.1"
prost-build = "0.14.1"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
serde-value = "0.7"
erased-serde = "0.4"
chrono = { version = "0.4.27", default-features = false, features = ["serde"] }
prost-wkt-derive = { version = "0.8.0", path = "wkt-derive" }
prost-wkt = { version = "0.8.0", path = "wkt" }
prost-wkt-types = { version = "0.8.0", path = "wkt-types" }

